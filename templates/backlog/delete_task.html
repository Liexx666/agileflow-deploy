{% extends 'base.html' %}

{% block title %}Delete Task | AgileFlow{% endblock %}

{% block content %}
<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">

            <h1 class="mb-3">Delete task</h1>

            <p>
                Are you sure you want to delete
                <strong>{{ task.title }}</strong>?
            </p>

            <p class="text-muted">
                This task will be removed from the Product Backlog.
            </p>

            <form method="post">
                {% csrf_token %}

                <div class="d-flex gap-2 mt-4">

                    <a href="javascript:void(0);" onclick="window.location.href = sessionStorage.getItem('delete_task_referer_{{ task.id }}') || '{% url 'backlog:task_detail' task.id %}';"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                    <button type="submit"
                            class="btn btn-danger">
                        Delete task
                    </button>

                </div>
            </form>

        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
    var ref = document.referrer;
    if (ref && !ref.includes('/delete') && !ref.includes('/edit') && !ref.includes('/new') && !ref.includes('/time') && !ref.includes('/assign/')) {
        sessionStorage.setItem('delete_task_referer_{{ task.id }}', ref);
    }
</script>
{% endblock %}
