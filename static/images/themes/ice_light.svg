<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="iceLightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="75%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="glacierGrad1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="glacierGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="frostHalo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#iceLightSky)"/>

  <!-- Distant Frozen Mountain Range Silhouettes -->
  <polygon points="120,760 420,500 650,730 920,440 1240,740 1560,470 1850,730 2050,590 2050,1100 -50,1100" fill="url(#glacierGrad1)"/>

  <!-- Foreground Crisp Iceberg Polygon Facets -->
  <polygon points="-50,880 280,660 580,900" fill="#38bdf8" fill-opacity="0.45"/>
  <polygon points="280,660 480,940 580,900" fill="#0284c7" fill-opacity="0.35"/>

  <polygon points="520,910 840,590 1150,920" fill="#7dd3fc" fill-opacity="0.55"/>
  <polygon points="840,590 1020,950 1150,920" fill="#0369a1" fill-opacity="0.3"/>

  <polygon points="1080,900 1420,570 1780,900" fill="#38bdf8" fill-opacity="0.6"/>
  <polygon points="1420,570 1620,940 1780,900" fill="#0284c7" fill-opacity="0.35"/>

  <!-- Frost Horizon Plane -->
  <rect y="910" width="1920" height="200" fill="url(#frostHalo)"/>
</svg>
