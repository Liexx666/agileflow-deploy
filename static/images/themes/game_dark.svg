<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gameNightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07040d"/>
      <stop offset="45%" stop-color="#12091f"/>
      <stop offset="85%" stop-color="#210d33"/>
      <stop offset="100%" stop-color="#0a0512"/>
    </linearGradient>
    <linearGradient id="neonSunDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#gameNightSky)"/>

  <!-- Glowing Sliced Neon Retro Sun -->
  <g transform="translate(960, 520)">
    <mask id="sunStripesDark">
      <rect x="-260" y="-260" width="520" height="520" fill="#ffffff"/>
      <rect x="-260" y="10" width="520" height="10" fill="#000000"/>
      <rect x="-260" y="38" width="520" height="14" fill="#000000"/>
      <rect x="-260" y="70" width="520" height="20" fill="#000000"/>
      <rect x="-260" y="110" width="520" height="26" fill="#000000"/>
      <rect x="-260" y="155" width="520" height="34" fill="#000000"/>
    </mask>
    <circle cx="0" cy="0" r="230" fill="url(#neonSunDark)" mask="url(#sunStripesDark)" filter="url(#neonGlow)" opacity="0.6"/>
    <circle cx="0" cy="0" r="230" fill="url(#neonSunDark)" mask="url(#sunStripesDark)"/>
  </g>

  <!-- Neon Wireframe Synthwave Mountain Ridges -->
  <g fill="#12081e" stroke="#c084fc" stroke-width="2" stroke-opacity="0.65">
    <polygon points="0,520 220,380 440,520"/>
    <polygon points="340,520 620,320 880,520"/>
    <polygon points="1040,520 1320,340 1600,520"/>
    <polygon points="1480,520 1720,400 1920,520"/>
  </g>
  <!-- Mountain Wireframe Subdivisions -->
  <g stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.4">
    <line x1="220" y1="380" x2="220" y2="520"/>
    <line x1="620" y1="320" x2="620" y2="520"/>
    <line x1="1320" y1="340" x2="1320" y2="520"/>
    <line x1="1720" y1="400" x2="1720" y2="520"/>
  </g>

  <!-- Glowing Horizon Laser Line -->
  <line x1="0" y1="520" x2="1920" y2="520" stroke="#22d3ee" stroke-width="3" filter="url(#neonGlow)"/>
  <line x1="0" y1="520" x2="1920" y2="520" stroke="#f472b6" stroke-width="2"/>

  <!-- Perspective Outrun Grid Floor -->
  <g>
    <!-- Horizontal Perspective Neon Lines -->
    <line x1="0" y1="535" x2="1920" y2="535" stroke="#d946ef" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="0" y1="565" x2="1920" y2="565" stroke="#d946ef" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="0" y1="620" x2="1920" y2="620" stroke="#d946ef" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="0" y1="700" x2="1920" y2="700" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.7"/>
    <line x1="0" y1="810" x2="1920" y2="810" stroke="#22d3ee" stroke-width="3" stroke-opacity="0.8"/>
    <line x1="0" y1="950" x2="1920" y2="950" stroke="#f43f5e" stroke-width="3.5" stroke-opacity="0.9"/>

    <!-- Converging Perspective Lines to Vanishing Point (960, 520) -->
    <line x1="960" y1="520" x2="-400" y2="1080" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.75"/>
    <line x1="960" y1="520" x2="-100" y2="1080" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.75"/>
    <line x1="960" y1="520" x2="200" y2="1080" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.75"/>
    <line x1="960" y1="520" x2="500" y2="1080" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.75"/>
    <line x1="960" y1="520" x2="750" y2="1080" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.75"/>
    <line x1="960" y1="520" x2="960" y2="1080" stroke="#f43f5e" stroke-width="3" stroke-opacity="0.85"/>
    <line x1="960" y1="520" x2="1170" y2="1080" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.75"/>
    <line x1="960" y1="520" x2="1420" y2="1080" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.75"/>
    <line x1="960" y1="520" x2="1720" y2="1080" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.75"/>
    <line x1="960" y1="520" x2="2020" y2="1080" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.75"/>
    <line x1="960" y1="520" x2="2320" y2="1080" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.75"/>
  </g>

  <!-- Glowing Pixel Stardust & Synth Stars -->
  <circle cx="220" cy="140" r="2" fill="#22d3ee" opacity="0.9"/>
  <circle cx="480" cy="80" r="3" fill="#f472b6" opacity="0.85"/>
  <circle cx="750" cy="180" r="2.5" fill="#c084fc" opacity="0.9"/>
  <circle cx="1240" cy="110" r="3" fill="#38bdf8" opacity="0.95"/>
  <circle cx="1520" cy="190" r="2" fill="#f472b6" opacity="0.8"/>
  <circle cx="1780" cy="100" r="3" fill="#ffffff" opacity="0.9"/>
</svg>
