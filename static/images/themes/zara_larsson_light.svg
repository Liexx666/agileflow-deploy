<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="zlLightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="35%" stop-color="#fed7aa"/>
      <stop offset="70%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#fb923c" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fce7f3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#db2777" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#zlLightSky)"/>

  <!-- Ambient Golden Sun Glow -->
  <circle cx="960" cy="850" r="750" fill="url(#sunGlow)"/>

  <!-- Sun Rays & Radiant Rings -->
  <circle cx="960" cy="850" r="540" fill="none" stroke="#f97316" stroke-opacity="0.25" stroke-width="2.5" stroke-dasharray="14 18"/>
  <circle cx="960" cy="850" r="400" fill="none" stroke="#f472b6" stroke-opacity="0.3" stroke-width="2.5" stroke-dasharray="10 14"/>
  <circle cx="960" cy="850" r="260" fill="none" stroke="#ea580c" stroke-opacity="0.35" stroke-width="2.5"/>
  <circle cx="960" cy="850" r="150" fill="#f97316" fill-opacity="0.4" filter="url(#softBlur)"/>

  <!-- Sweeping Horizon Soundwave Ribbons -->
  <path d="M-100,700 C400,580 700,800 1100,670 C1500,540 1750,730 2050,660 L2050,1100 L-100,1100 Z" fill="url(#waveGrad1)"/>
  <path d="M-100,800 C350,720 680,870 1050,760 C1420,650 1700,830 2050,770 L2050,1100 L-100,1100 Z" fill="url(#waveGrad2)"/>

  <!-- Warm Golden Glow Horizon Bar -->
  <rect y="920" width="1920" height="160" fill="#fed7aa" fill-opacity="0.35"/>
</svg>
