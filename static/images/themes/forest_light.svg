<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="forestDaySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="45%" stop-color="#bbf7d0"/>
      <stop offset="85%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="pineGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="pineGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="pineGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Godrays Sunburst -->
    <linearGradient id="godRays" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#forestDaySky)"/>

  <!-- Morning Sun Godrays Filtering from Top Left -->
  <polygon points="0,0 450,1080 320,1080" fill="url(#godRays)"/>
  <polygon points="0,0 850,1080 680,1080" fill="url(#godRays)" opacity="0.85"/>
  <polygon points="0,0 1350,1080 1150,1080" fill="url(#godRays)" opacity="0.7"/>

  <!-- Layer 1: Distant Rolling Alpine Hills -->
  <path d="M-50,660 Q450,520 980,630 T2020,590 L2020,1100 L-50,1100 Z" fill="url(#pineGrad1)"/>

  <!-- Layer 2: Midground Pine Trees Repeating Silhouettes -->
  <g fill="url(#pineGrad2)">
    <polygon points="120,680 70,780 170,780"/>
    <polygon points="120,740 50,850 190,850"/>
    <polygon points="260,650 200,760 320,760"/>
    <polygon points="260,720 180,830 340,830"/>
    <polygon points="410,670 350,780 470,780"/>
    <polygon points="410,740 330,850 490,850"/>
    <polygon points="580,640 520,750 640,750"/>
    <polygon points="580,710 500,820 660,820"/>
    <polygon points="760,660 700,770 820,770"/>
    <polygon points="760,730 680,840 840,840"/>
    <polygon points="940,630 880,740 1000,740"/>
    <polygon points="940,700 860,810 1020,810"/>
    <polygon points="1120,660 1060,770 1180,770"/>
    <polygon points="1120,730 1040,840 1200,840"/>
    <polygon points="1300,640 1240,750 1360,750"/>
    <polygon points="1300,710 1220,820 1380,820"/>
    <polygon points="1480,670 1420,780 1540,780"/>
    <polygon points="1480,740 1400,850 1560,850"/>
    <polygon points="1660,650 1600,760 1720,760"/>
    <polygon points="1660,720 1580,830 1740,830"/>
    <polygon points="1840,680 1780,790 1900,790"/>
    <polygon points="1840,750 1760,860 1920,860"/>
  </g>

  <!-- Layer 3: Foreground Meadow Ridge -->
  <path d="M-50,830 Q500,770 1100,840 T2020,820 L2020,1100 L-50,1100 Z" fill="url(#pineGrad3)"/>
</svg>
