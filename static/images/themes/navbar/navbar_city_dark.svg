<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
    <defs>
        <linearGradient id="neonCityStreak" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
            <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
        </linearGradient>
        <linearGradient id="cyberSkyline" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
        </linearGradient>
    </defs>
    <!-- Cyberpunk Nocturnal Skyscrapers -->
    <rect x="135" y="22" width="18" height="32" fill="url(#cyberSkyline)" stroke="#06b6d4" stroke-width="0.8"/>
    <!-- Center Main Tower -->
    <rect x="158" y="10" width="26" height="44" fill="url(#cyberSkyline)" stroke="#38bdf8" stroke-width="1"/>
    <!-- Communication spire with beacon -->
    <line x1="171" y1="2" x2="171" y2="10" stroke="#06b6d4" stroke-width="1.8"/>
    <circle cx="171" cy="2" r="1.5" fill="#f43f5e"/>
    <!-- Glowing matrix window pixels -->
    <rect x="163" y="16" width="3" height="2" fill="#06b6d4"/>
    <rect x="169" y="16" width="3" height="2" fill="#38bdf8"/>
    <rect x="175" y="16" width="3" height="2" fill="#facc15"/>
    <rect x="163" y="24" width="3" height="2" fill="#38bdf8"/>
    <rect x="175" y="24" width="3" height="2" fill="#06b6d4"/>
    <rect x="169" y="32" width="3" height="2" fill="#f43f5e"/>
    <!-- Stepped skyscraper 2 -->
    <rect x="190" y="18" width="20" height="36" fill="url(#cyberSkyline)" stroke="#a855f7" stroke-width="0.8"/>
    <rect x="196" y="26" width="3" height="2" fill="#a855f7"/>
    <rect x="202" y="26" width="3" height="2" fill="#06b6d4"/>
    <!-- Neon highway traffic light speed-trails -->
    <path d="M10 52 L 230 52" stroke="url(#neonCityStreak)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M25 47 L 180 47" stroke="#06b6d4" stroke-width="1.2" opacity="0.6" stroke-dasharray="8 6"/>
    <path d="M40 55 L 210 55" stroke="#ec4899" stroke-width="1.2" opacity="0.5"/>
    <!-- Cyber Moon and beacon rings -->
    <circle cx="95" cy="18" r="8" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.75"/>
    <path d="M95 10 A 8 8 0 0 1 103 18 A 8 8 0 0 0 95 10 Z" fill="#38bdf8" opacity="0.8"/>
</svg>
