<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
    <defs>
        <linearGradient id="zlSun" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fb923c" stop-opacity="0.95"/>
            <stop offset="50%" stop-color="#f97316" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.7"/>
        </linearGradient>
        <linearGradient id="zlWave" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#fdba74" stop-opacity="0.2"/>
            <stop offset="50%" stop-color="#f97316" stop-opacity="0.75"/>
            <stop offset="100%" stop-color="#ec4899" stop-opacity="0.85"/>
        </linearGradient>
        <radialGradient id="zlGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <!-- Soft background glow -->
    <circle cx="175" cy="30" r="28" fill="url(#zlGlow)"/>
    <!-- Radiating melody sunburst arcs -->
    <path d="M140 38 A 36 36 0 0 1 210 38" stroke="url(#zlSun)" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>
    <path d="M148 38 A 28 28 0 0 1 202 38" stroke="url(#zlSun)" stroke-width="2" stroke-opacity="0.7"/>
    <!-- Rising sunset sun disc -->
    <circle cx="175" cy="38" r="14" fill="url(#zlSun)"/>
    <line x1="175" y1="18" x2="175" y2="12" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
    <line x1="161" y1="24" x2="156" y2="20" stroke="#fb923c" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="189" y1="24" x2="194" y2="20" stroke="#fb923c" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Music equalizer wave ribbons -->
    <path d="M10 44 Q 35 15, 60 40 T 110 36 T 150 42" stroke="url(#zlWave)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M30 48 Q 55 25, 80 44 T 130 38" stroke="url(#zlWave)" stroke-width="1.6" stroke-opacity="0.5" fill="none" stroke-linecap="round"/>
    <!-- Sound bars -->
    <rect x="72" y="32" width="2.5" height="12" rx="1.2" fill="#f97316" opacity="0.8"/>
    <rect x="78" y="24" width="2.5" height="20" rx="1.2" fill="#fb923c" opacity="0.9"/>
    <rect x="84" y="28" width="2.5" height="16" rx="1.2" fill="#f43f5e" opacity="0.85"/>
    <rect x="90" y="35" width="2.5" height="9" rx="1.2" fill="#fdba74" opacity="0.75"/>
    <!-- Shimmering star sparkle -->
    <path d="M115 20 Q 115 26, 121 26 Q 115 26, 115 32 Q 115 26, 109 26 Q 115 26, 115 20 Z" fill="#f59e0b" opacity="0.85"/>
    <circle cx="218" cy="22" r="2" fill="#fb923c" opacity="0.8"/>
</svg>
