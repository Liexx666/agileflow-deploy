<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
    <defs>
        <radialGradient id="fireflyNav" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
            <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="forestDarkTree" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#022c22" stop-opacity="0.95"/>
        </linearGradient>
    </defs>
    <!-- Midnight Crescent Moon (Warm Golden Amber) -->
    <path d="M70 12 A 12 12 0 0 0 82 24 A 10 10 0 0 1 70 12 Z" fill="#fef08a" opacity="0.9"/>
    <!-- Midnight Evergreen Pines -->
    <polygon points="148,22 142,32 154,32" fill="url(#forestDarkTree)" stroke="#065f46" stroke-width="0.5"/>
    <polygon points="148,28 140,40 156,40" fill="url(#forestDarkTree)"/>
    <polygon points="148,36 137,50 159,50" fill="url(#forestDarkTree)"/>
    <!-- Main Evergreen -->
    <polygon points="175,10 167,24 183,24" fill="#032119" stroke="#34d399" stroke-width="0.7"/>
    <polygon points="175,20 164,36 186,36" fill="#032119"/>
    <polygon points="175,32 160,52 190,52" fill="#02140e"/>
    <!-- Tree 3 -->
    <polygon points="198,18 192,30 204,30" fill="url(#forestDarkTree)"/>
    <polygon points="198,26 190,42 206,42" fill="url(#forestDarkTree)"/>
    <polygon points="198,38 187,52 209,52" fill="url(#forestDarkTree)"/>
    <!-- Nocturnal misty woodland slope -->
    <path d="M10 52 Q 70 44, 130 50 T 235 52" stroke="#059669" stroke-width="1.8" opacity="0.6" fill="none"/>
    <!-- Glowing Bioluminescent Firefly Orbs with Halos -->
    <circle cx="110" cy="24" r="7" fill="url(#fireflyNav)"/>
    <circle cx="110" cy="24" r="1.8" fill="#ffffff"/>
    <circle cx="140" cy="16" r="6" fill="url(#fireflyNav)"/>
    <circle cx="140" cy="16" r="1.5" fill="#fef08a"/>
    <circle cx="215" cy="22" r="8" fill="url(#fireflyNav)"/>
    <circle cx="215" cy="22" r="2" fill="#ffffff"/>
    <circle cx="185" cy="14" r="5" fill="url(#fireflyNav)"/>
    <circle cx="185" cy="14" r="1.3" fill="#a7f3d0"/>
</svg>
