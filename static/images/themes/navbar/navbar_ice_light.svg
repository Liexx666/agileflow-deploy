<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
    <defs>
        <linearGradient id="iceLGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.95"/>
            <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5"/>
        </linearGradient>
        <linearGradient id="iceShard" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.6"/>
        </linearGradient>
    </defs>
    <!-- Faceted crystalline iceberg peaks -->
    <polygon points="175,12 150,48 185,48" fill="url(#iceLGrad)" stroke="#bae6fd" stroke-width="1"/>
    <polygon points="175,12 185,48 200,48" fill="url(#iceShard)" stroke="#ffffff" stroke-width="0.8"/>
    <polygon points="142,24 125,48 152,48" fill="url(#iceLGrad)" opacity="0.75"/>
    <polygon points="198,22 185,48 212,48" fill="url(#iceLGrad)" opacity="0.65"/>
    <!-- Crystalline contour lines -->
    <path d="M10 46 L 50 38 L 90 44 L 130 35 L 165 42 L 205 38 L 235 44" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.6" stroke-linecap="round"/>
    <path d="M25 50 L 65 44 L 105 48 L 145 42 L 185 46" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>
    <!-- Snowflake motif -->
    <g transform="translate(68, 22) scale(0.85)">
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="-10" y1="0" x2="10" y2="0" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="-7" y1="-7" x2="7" y2="7" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="-7" y1="7" x2="7" y2="-7" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="2.5" fill="#38bdf8"/>
    </g>
    <!-- Geometric prism sparkle -->
    <polygon points="110,18 114,24 110,30 106,24" fill="#38bdf8" opacity="0.85"/>
    <polygon points="220,16 223,21 220,26 217,21" fill="#7dd3fc" opacity="0.8"/>
</svg>
