<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cityDaySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#bae6fd"/>
      <stop offset="85%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="buildingGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="buildingGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="archGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#2563eb" stroke-width="0.75" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Sky Base & Blueprint Grid -->
  <rect width="1920" height="1080" fill="url(#cityDaySky)"/>
  <rect width="1920" height="750" fill="url(#archGrid)"/>

  <!-- Distant Background Skyline Silhouette Layer -->
  <g fill="url(#buildingGrad1)">
    <!-- Tower 1 -->
    <rect x="80" y="500" width="110" height="580"/>
    <polygon points="135,430 80,500 190,500"/>
    <line x1="135" y1="370" x2="135" y2="430" stroke="#2563eb" stroke-width="2.5" stroke-opacity="0.7"/>

    <rect x="230" y="560" width="90" height="520"/>
    <rect x="360" y="470" width="140" height="610"/>
    <polygon points="360,470 430,410 500,470"/>

    <!-- Center Highrises -->
    <rect x="540" y="540" width="100" height="540"/>
    <rect x="680" y="410" width="130" height="670"/>
    <line x1="745" y1="330" x2="745" y2="410" stroke="#1d4ed8" stroke-width="3" stroke-opacity="0.7"/>

    <rect x="850" y="510" width="110" height="570"/>
    <rect x="1000" y="390" width="150" height="690"/>
    <polygon points="1000,390 1075,310 1150,390"/>

    <rect x="1190" y="490" width="100" height="590"/>
    <rect x="1330" y="450" width="140" height="630"/>
    <polygon points="1400,370 1330,450 1470,450"/>

    <rect x="1510" y="540" width="120" height="540"/>
    <rect x="1670" y="480" width="130" height="600"/>
  </g>

  <!-- Midground Skyline Silhouette Layer with Window Columns -->
  <g fill="url(#buildingGrad2)">
    <rect x="160" y="600" width="120" height="480"/>
    <rect x="320" y="530" width="150" height="550"/>
    <!-- Angled Roof Tower -->
    <polygon points="510,610 630,530 630,1080 510,1080"/>
    <rect x="670" y="570" width="130" height="510"/>
    <!-- Iconic Center Tower -->
    <rect x="840" y="450" width="160" height="630"/>
    <polygon points="840,450 920,370 1000,450"/>
    <line x1="920" y1="280" x2="920" y2="370" stroke="#1e3a8a" stroke-width="3.5" stroke-opacity="0.8"/>

    <rect x="1040" y="560" width="140" height="520"/>
    <rect x="1220" y="520" width="130" height="560"/>
    <rect x="1390" y="580" width="150" height="500"/>
    <rect x="1580" y="550" width="120" height="530"/>
  </g>

  <!-- Architectural Suspension Bridge Cable Accents -->
  <path d="M-50,840 Q400,690 960,840 T1970,840" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-opacity="0.45"/>
  <path d="M-50,890 Q400,790 960,890 T1970,890" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Waterfront Reflection Glow with Vivid Sapphire Shimmer -->
  <rect y="920" width="1920" height="160" fill="#93c5fd" fill-opacity="0.35"/>
  <rect y="980" width="1920" height="100" fill="#60a5fa" fill-opacity="0.25"/>
</svg>
