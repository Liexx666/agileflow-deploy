<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gameDaySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="45%" stop-color="#e9d5ff"/>
      <stop offset="80%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="retroSunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="40%" stop-color="#ec4899"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#gameDaySky)"/>

  <!-- Sliced Vaporwave Retro Sun on Horizon -->
  <g transform="translate(960, 520)">
    <mask id="sunStripesLight">
      <rect x="-240" y="-240" width="480" height="480" fill="#ffffff"/>
      <!-- Slices across sun -->
      <rect x="-240" y="20" width="480" height="8" fill="#000000"/>
      <rect x="-240" y="45" width="480" height="12" fill="#000000"/>
      <rect x="-240" y="75" width="480" height="18" fill="#000000"/>
      <rect x="-240" y="110" width="480" height="24" fill="#000000"/>
      <rect x="-240" y="150" width="480" height="32" fill="#000000"/>
    </mask>
    <circle cx="0" cy="0" r="230" fill="url(#retroSunGrad)" mask="url(#sunStripesLight)" opacity="0.6"/>
  </g>

  <!-- Perspective Outrun Grid Floor -->
  <g opacity="0.75">
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="520" x2="1920" y2="520" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.45"/>
    <line x1="0" y1="560" x2="1920" y2="560" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="0" y1="610" x2="1920" y2="610" stroke="#8b5cf6" stroke-width="2.2" stroke-opacity="0.55"/>
    <line x1="0" y1="670" x2="1920" y2="670" stroke="#8b5cf6" stroke-width="2.5" stroke-opacity="0.6"/>
    <line x1="0" y1="740" x2="1920" y2="740" stroke="#a855f7" stroke-width="2.8" stroke-opacity="0.65"/>
    <line x1="0" y1="830" x2="1920" y2="830" stroke="#c084fc" stroke-width="3" stroke-opacity="0.7"/>
    <line x1="0" y1="940" x2="1920" y2="940" stroke="#c084fc" stroke-width="3.5" stroke-opacity="0.75"/>

    <!-- Perspective Vanishing Lines -->
    <line x1="960" y1="520" x2="0" y2="1080" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="960" y1="520" x2="300" y2="1080" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="960" y1="520" x2="600" y2="1080" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="960" y1="520" x2="800" y2="1080" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="960" y1="520" x2="960" y2="1080" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.6"/>
    <line x1="960" y1="520" x2="1120" y2="1080" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="960" y1="520" x2="1320" y2="1080" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="960" y1="520" x2="1620" y2="1080" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="960" y1="520" x2="1920" y2="1080" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5"/>
  </g>

  <!-- Horizon Glow -->
  <rect y="500" width="1920" height="40" fill="#ec4899" fill-opacity="0.25"/>
</svg>
